# --- Hooks ------------------------------------------------------------------------------------

# Native mouse look. sub_821C7EB0 is the player's look update: it reads the LookHorizontal /
# LookVertical axes, applies the stick curve, invert option, sensitivity option and aim assist,
# leaving yaw/pitch deltas (radians) in stack floats at r1+80 / r1+84. At 0x821C80CC (reached on
# every path) the deltas still go through zoom scaling, the cutscene look-lock (sub_821743D8) and
# the aiming slow-down, then are applied by sub_821C0DC8 / sub_821C4B28. JthMouseLook
# (src/pc_input.cpp) adds the raw mouse movement here.
# Lua errors (src/dev_lua.cpp). 0x8260C748 is luaD_throw(L = r3, status = r4), where every script
# error passes before it unwinds to the protected call; the hook (after the prologue, r3/r4 still
# intact) logs the error message so script failures show up in the log instead of vanishing.
[[midasm_hook]]
address = 0x8260C758
name = "JthLuaThrow"
registers = ["r3", "r4"]

# The renderer's HDR parameter setters (src/graphics_settings.cpp): at entry f3 = max brightening,
# capped by hdr_max_brightening. sub_8213E3E8 sets the target values, sub_8213E468 the current.
[[midasm_hook]]
address = 0x8213E3E8
name = "JthHdrParams"
registers = ["f3"]

[[midasm_hook]]
address = 0x8213E468
name = "JthHdrParams"
registers = ["f3"]

# ActorProperties_SPBase's apply-damage method (sub_82368F98, r3 = the victim's ActorProperties:
# +8 health, +192 its actor; r4 = damage info, +92 source: a bullet (type 16, shooter at +212) or
# the attacker itself (type 7)). 0x823692E4 is where all paths meet with the final damage in f30
# (after the difficulty multipliers Dmg_Player / Dmg_Bot), the attacker in r27 and the victim's
# properties in r29: the one-hit-kill cheat and --log_damage (src/cheats.cpp).
[[midasm_hook]]
address = 0x823692E4
name = "JthDamage"
registers = ["r27", "r29", "f30"]

# The plain ActorProperties apply-damage (sub_822D7510: health at r3+8 -= info+24), after the
# prologue: same cheat for objects using the base class.
[[midasm_hook]]
address = 0x822D7520
name = "JthDamageBase"
registers = ["r3", "r4"]

# Animal::Damage (sub_822EF018, Animal vtable slot 90; humans use Actor::Damage -> the properties
# above): dinosaurs keep their own health at +412 and lose info+24 at 0x822EF114. Same cheat.
[[midasm_hook]]
address = 0x822EF114
name = "JthDamageAnimal"
registers = ["r3", "r4"]

# csControllerActor's movement step (sub_82241E10, r31 = the controller). At 0x82242050 it loads
# the input speed modifier (+264, set by the script command scSetInputSpeedModifier) into f0 and
# then multiplies the movement input (+76/+80/+84) by it. JthMoveSpeed (src/cheats.cpp) scales f0
# for the player's controller: the super speed cheat.
[[midasm_hook]]
address = 0x82242054
name = "JthMoveSpeed"
registers = ["r31", "f0"]

# wsModeReloadPlasmaGun's update (sub_82373A50, r31 = the mode once the prologue is done). The
# plasma gun has no reserve: its rounds come from a charge timer (mode +68, full at +72 = capacity
# x bullet_load_time) that each shot spends and time refills, and this update rewrites the loaded
# count (+616) from it every frame. JthPlasmaCharge (src/cheats.cpp) keeps the timer full for the
# infinite-ammo cheat, which otherwise couldn't keep this gun's magazine full.
[[midasm_hook]]
address = 0x82373A64
name = "JthPlasmaCharge"
registers = ["r31"]

# luaL_loadbuffer (0x82604C30, r4 = code, r5 = length, r6 = chunk name), after the prologue:
# --log_lua_chunks=<text> logs the chunks whose code contains <text> ("*" = all), e.g. to find
# which object a prefab script belongs to (chunk names are "[PrefabPosition - <ID>]").
[[midasm_hook]]
address = 0x82604C3C
name = "JthLuaLoad"
registers = ["r4", "r5", "r6"]

[[midasm_hook]]
address = 0x821C80CC
name = "JthMouseLook"
registers = ["r1", "r31"]

# Field of view. sub_82260948 is Camera::Update: it takes the camera FOV (+148, 70 deg at 4:3),
# widens it for 16:9 when the renderer's widescreen flag (+271) is set, and at 0x82260A98 calls
# the perspective builder sub_822640F0(proj, f1 = horizontal FOV in radians, f2 = aspect (h/w),
# f3 = near, f4 = far). JthCameraFov (src/pc_options.cpp) rescales f1 for the player camera.
[[midasm_hook]]
address = 0x82260A98
name = "JthCameraFov"
registers = ["f1", "r31"]

# Frame pacing for frame rates above the original 30 fps. 0x824BA09C is the game's only call to
# VdSwap (frame present), in sub_824B9E28. JthFramePace (src/framerate.cpp) waits there so frames
# are presented at an even rate; it does nothing at the default 30 fps.
[[midasm_hook]]
address = 0x824BA09C
name = "JthFramePace"
registers = []

# The game's file layer (src/game_files.cpp): stream open (sub_82130F08, r3 = stream, r4 = path
# relative to the disc), read (sub_82130378, r3 = stream, r4 = buffer, r5 = size), the read's two
# returns (disc file / archive file, r3 = bytes read) and close (sub_82130598, destructor
# sub_82130AB8). Used to swap in the PlayStation button textures (src/button_prompts.cpp) and for
# the --dump_game_files developer tool.
[[midasm_hook]]
address = 0x82130F08
name = "JthOpenFile"
registers = ["r3", "r4"]

[[midasm_hook]]
address = 0x82130378
name = "JthStreamRead"
registers = ["r3", "r4", "r5"]

[[midasm_hook]]
address = 0x82130450
name = "JthStreamReadDone"
registers = ["r3"]

[[midasm_hook]]
address = 0x821304A8
name = "JthStreamReadDone"
registers = ["r3"]

[[midasm_hook]]
address = 0x82130598
name = "JthStreamClose"
registers = ["r3"]

[[midasm_hook]]
address = 0x82130AB8
name = "JthStreamClose"
registers = ["r3"]
