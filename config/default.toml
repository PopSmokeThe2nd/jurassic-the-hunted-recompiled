# Recompiler hints for default.xex (Jurassic: The Hunted, USA, title 41560870, built 2009-10-04).
#
# Each entry here fixes something the automatic analysis could not work out on its own.
# Addresses are guest virtual addresses (image base 0x82000000).

# C runtime setjmp / longjmp. The 1344-byte jump buffer holds the GPRs, FPRs, VMX registers, CR,
# the return address (+308) and r1 (+144). Lua uses them for script errors: luaD_rawrunprotected
# (0x8260BD70, under lua_pcall) calls setjmp and luaD_throw longjmps back to it; a few image
# decoders use them the same way. Translated as ordinary functions, longjmp can't jump back (it
# overwrote the guest registers, r1 included, and returned into the code that raised the error),
# so ANY script error - even one the game catches and ignores - corrupted state and ended in
# "PANIC: unprotected error in call to Lua API". L13 died that way while loading. With these set,
# the code generator emits ppc_setjmp / ppc_longjmp (generated pch: host setjmp/longjmp keyed by
# the guest buffer address, per thread).
setjmp_address = 0x8261C960
longjmp_address = 0x8261C520

# Functions the code generator translates wrongly are replaced by hand in src/fixes.cpp
# (e.g. sub_8236F3C8, whose function-table tail call was misread as a switch).

[functions]
# C++ this-pointer adjustor thunk: addi r3,r3,8 ; b 0x824FF588.
# Only reached by a tail-jump from the neighbouring thunk at 0x82500B78 (and via vtables).
0x82500B70 = { size = 0x8 }

# Small leaf function (sets a mode flag at +0x23C based on r4), reached only by a tail-jump
# from 0x82509674.
0x8251A420 = { size = 0x28 }

# One-instruction stub: b 0x8250B5E8. Tail-jumped to from adjustor thunks at 0x8250BAB8
# and 0x8250DA40.
0x8250D8C0 = { size = 0x4 }

